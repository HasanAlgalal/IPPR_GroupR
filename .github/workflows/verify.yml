name: Verify plate recognition pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/requirements-test.txt
      - run: python -m pip install -r code/requirements-test.txt
      - run: python -m compileall -q code/main_gui.py code/pipeline code/test_pipeline.py
      - run: python -m unittest discover -s tests -v
      - run: python code/test_pipeline.py --help
